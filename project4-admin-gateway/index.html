<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f4f4f2" />
  <title>Brantone Veylor Admin · Admin</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f4f4f2;overflow:hidden}
    *{box-sizing:border-box}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#343434;background:linear-gradient(135deg,#f8f8f7,#ececeb);z-index:2}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:1}
  </style>
</head>
<body>
  <div id="loading">正在进入管理后台…</div>
  <iframe id="platform" title="Brantone Veylor Admin"
    src="https://brantone-veyor-trading.onrender.com/?portal=admin"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    document.getElementById("platform").addEventListener("load",function(){
      document.getElementById("loading").style.display="none";
    });
  </script>
</body>
</html>
