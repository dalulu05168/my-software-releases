name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  trading-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project4-render-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Security and layout regression tests
        run: node --test tests/security-acceptance.test.mjs
      - run: test -s dist/index.html
