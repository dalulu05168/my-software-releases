name: P004 backend schema checks
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/p004-backend-schema-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/p004-backend-schema-ci.yml"
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p004_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p004_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: p004_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase auth fixture
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users(id uuid PRIMARY KEY); CREATE ROLE authenticated NOLOGIN; CREATE ROLE anon NOLOGIN;"
      - name: Apply P004 schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018_p004_identity.sql
      - name: Verify constraints and deny-by-default isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/identity_schema_test.sql
